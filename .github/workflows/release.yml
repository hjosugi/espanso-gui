name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            formats: deb,appimage,pacman
          - name: windows-x86_64
            os: windows-2025
            formats: wix,nsis
          - name: macos-aarch64
            os: macos-15
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build packages
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: espanso-gui-${{ matrix.name }}
          path: |
            dist/**
            !dist/.cargo-packager/**
            !dist/**/*.app/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          (cd release-assets && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            gh release create "${GITHUB_REF_NAME}" release-assets/* SHA256SUMS \
              --title "Espanso GUI ${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}" \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* SHA256SUMS \
              --title "Espanso GUI ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
