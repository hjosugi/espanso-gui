name: Feature request
description: Suggest an improvement to Espanso GUI
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: This project is independent. Requests must be implementable within Espanso GUI and must not require contacting Espanso maintainers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the desired user flow, not only the implementation.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platform scope
      multiple: true
      options: [Windows, macOS, Linux, All platforms]
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Espanso configuration impact
      description: Include sanitized example YAML if relevant.
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: This request can be handled entirely inside Espanso GUI.
          required: true
